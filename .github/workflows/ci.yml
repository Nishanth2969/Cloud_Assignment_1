name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Lint frontend
      run: |
        cd frontend
        npm run lint
    
    - name: Test frontend
      run: |
        cd frontend
        npm run test
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build

  lambda-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8 black
    
    - name: Lint Python code
      run: |
        flake8 lambda-functions/ other-scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 lambda-functions/ other-scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Format check
      run: |
        black --check lambda-functions/ other-scripts/
    
    - name: Test Lambda functions
      run: |
        cd lambda-functions/lf1_lex_hook
        pip install -r requirements.txt
        python -m pytest tests/ -v
        
        cd ../lf2_suggestions_worker
        pip install -r requirements.txt
        python -m pytest tests/ -v
